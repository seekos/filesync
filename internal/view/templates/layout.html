{{define "style"}}
  <style>
    :root { color-scheme: light; --bg:#f4f6f8; --panel:#fff; --text:#17202a; --muted:#667085; --line:#d8dee8; --soft:#eef2f7; --primary:#1677ff; --danger:#c2410c; --ok:#188038; --warn:#a15c07; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
    header { display:flex; align-items:baseline; gap:14px; background:#182230; color:#fff; padding:16px 28px; border-bottom:1px solid #26364c; }
    .brand { font-weight:800; font-size:18px; }
    .header-sub { color:#b8c2d2; font-size:13px; }
    main { max-width:1280px; margin:0 auto; padding:28px; }
    h1 { margin:0 0 6px; font-size:26px; letter-spacing:0; }
    p { margin:0; color:var(--muted); }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .toolbar { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:20px; }
    .button, button { display:inline-flex; align-items:center; justify-content:center; min-height:36px; padding:0 13px; border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--text); text-decoration:none; cursor:pointer; font:inherit; font-weight:650; }
    .button:hover, button:hover { border-color:#b9c3d2; background:#f8fafc; }
    .primary { background:var(--primary); border-color:var(--primary); color:#fff; }
    .primary:hover { background:#0f66dc; border-color:#0f66dc; }
    .danger { color:var(--danger); }
    .table-wrap, .form { background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden; box-shadow:0 10px 28px rgba(16, 24, 40, .06); }
    table { width:100%; border-collapse:collapse; table-layout:fixed; }
    .col-name { width:9%; }
    .col-paths { width:39%; }
    .col-online { width:7%; }
    .col-interval { width:6%; }
    .col-status { width:21%; }
    .col-time { width:8%; }
    .col-actions { width:180px; }
    th, td { padding:14px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; font-size:14px; }
    th { background:#f0f3f7; color:#445064; font-weight:800; font-size:12px; text-transform:uppercase; }
    tbody tr { background:#fff; }
    tbody tr:hover { background:#fbfcfe; }
    tr:last-child td { border-bottom:0; }
    .route-cell { min-width:0; }
    .route-line { display:grid; grid-template-columns:auto minmax(0, 1fr) auto auto minmax(0, 1fr); gap:8px; align-items:center; }
    .route-label { color:var(--muted); font-size:12px; font-weight:800; white-space:nowrap; }
    .route-arrow { display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px; border-radius:999px; background:#edf4ff; color:var(--primary); font-weight:900; }
    .route-path { display:block; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#344054; background:#f7f9fc; border:1px solid #e3e8ef; border-radius:6px; padding:7px 8px; }
    .actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; width:100%; }
    .actions form { margin:0; }
    .actions .button, .actions button { width:100%; min-width:0; padding:0 10px; white-space:nowrap; }
    .status-cell { min-width:0; }
    .state-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
    .status { display:inline-flex; min-width:72px; justify-content:center; padding:4px 8px; border-radius:999px; background:#eef2f6; color:#394456; font-size:12px; font-weight:800; }
    .status.success { background:#e7f5ec; color:var(--ok); }
    .status.failed { background:#fff1eb; color:var(--danger); }
    .status.running { background:#e8f2ff; color:var(--primary); }
    .status.stopped { background:#fff7e6; color:var(--warn); }
    .receiver { display:inline-flex; justify-content:center; min-width:64px; padding:4px 8px; border-radius:999px; background:#eef2f6; color:#394456; font-size:12px; font-weight:800; }
    .receiver.在线 { background:#e7f5ec; color:var(--ok); }
    .receiver.离线 { background:#fff1eb; color:var(--danger); }
    .receiver.未配置 { background:#fff7e6; color:var(--warn); }
    .progress-step { font-weight:800; color:#344054; }
    .progress-bar { height:8px; border-radius:999px; overflow:hidden; background:#e5e9f0; }
    .progress-bar.wide { width:100%; }
    .progress-bar.mini { flex:1; min-width:80px; height:6px; }
    .progress-bar span { display:block; height:100%; background:var(--primary); }
    .metrics { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:8px; margin-top:8px; color:#344054; font-size:12px; font-weight:700; }
    .metrics span { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .file-counts { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; color:var(--muted); font-size:12px; }
    .current-file { display:grid; grid-template-columns:auto minmax(0, 1fr); gap:8px; align-items:center; margin-top:10px; color:#344054; }
    .current-file span { color:var(--muted); font-size:12px; }
    .current-file code { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; background:#f7f9fc; border:1px solid #e3e8ef; border-radius:6px; padding:6px 8px; }
    .file-mini { display:flex; align-items:center; gap:8px; margin-top:8px; color:var(--muted); font-size:12px; }
    .muted { margin-top:6px; color:var(--muted); font-size:12px; }
    .error { max-width:100%; margin-top:8px; color:var(--danger); line-height:1.45; word-break:break-word; }
    .empty { text-align:center; color:var(--muted); padding:48px; }
    .form { padding:22px; display:grid; gap:18px; }
    label { display:grid; gap:8px; color:#344054; font-weight:650; }
    input, textarea { width:100%; border:1px solid var(--line); border-radius:6px; padding:11px 12px; font:inherit; color:var(--text); background:#fff; }
    textarea { resize:vertical; }
    .radio-group { border:0; padding:0; margin:0; display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:12px; }
    .radio-group legend { grid-column:1 / -1; padding:0; color:#344054; font-weight:650; }
    .radio-option { display:flex; align-items:flex-start; gap:10px; padding:13px; border:1px solid var(--line); border-radius:8px; background:#fff; cursor:pointer; }
    .radio-option:has(input:checked) { border-color:var(--primary); background:#f0f7ff; }
    .radio-option input { width:auto; margin-top:3px; }
    .radio-option span { display:grid; gap:3px; }
    .radio-option small { color:var(--muted); font-weight:500; line-height:1.4; }
    .grid { display:grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap:16px; align-items:end; }
    .check { display:flex; gap:10px; align-items:center; min-height:42px; }
    .check input { width:auto; }
    @media (max-width: 820px) {
      main { padding:18px; }
      header { padding:14px 18px; }
      .toolbar, .actions { flex-direction:column; align-items:stretch; }
      .grid, .radio-group { grid-template-columns:1fr; }
      .table-wrap { overflow:auto; }
      table { min-width:1180px; }
    }
  </style>
{{end}}
